    <style>
      html, body {

            <div class="window hidden map-window" id="map-window" style="width:360px; height:280px; top:60px; left:60px;" aria-hidden="true">

        <div class="title">Site Map</div>

          <img src="../assets/x button.svg" alt="Close map window">

      </div>

    <div class="window hidden" id="entries-window" style="width:400px; height:300px; top:70px; left:40px;">
        <div class="title-bar">
            <div class="title">entry xx</div>
            <button class="close">
                <img src="../assets/x button.svg" alt="exit-button">
            </button>
        </div>
        <iframe src="textentries.html"></iframe>
    </div>

    <div class="window hidden" id="image-entries-window" style="width:650px; height:600px; top:150px; left:480px;">

            <div class="title">entry xx</div>
        </div>
        <iframe src="imageentries.html"></iframe>
    </div>

    <script src="../main.js"></script>
    
    <script>
      function openWindow(item) {
        const entriesWin = document.getElementById('entries-window');
        const imageEntriesWin = document.getElementById('image-entries-window');
        const overlay = document.getElementById("overlay");
        overlay.classList.add('active');
        entriesWin.classList.remove('hidden');
        imageEntriesWin.classList.remove('hidden');
        entriesWin.querySelector('.title').textContent = item;
        imageEntriesWin.querySelector('.title').textContent = item + ' image';
        entriesWin.querySelector('iframe').src = 'textentries.html?item=' + item;
        imageEntriesWin.querySelector('iframe').src = 'imageentries.html?item=' + item;
      }

      // Set up close button behavior on page load
      window.addEventListener('load', () => {
        const entriesWin = document.getElementById('entries-window');
        const imageEntriesWin = document.getElementById('image-entries-window');
        const closeBtn = entriesWin.querySelector('.close');


        
        if (closeBtn) {
          closeBtn.addEventListener('click', () => {
            entriesWin.classList.add('hidden');
            imageEntriesWin.classList.add('hidden');
            overlay.classList.remove('active');
          });
        }
      });


      window.addEventListener('load', () => {
  const windows = Array.from(document.querySelectorAll('.window'));

  windows.forEach((win) => {
    const title = win.querySelector('.title-bar');
    if (!title) return;

    let dragging = false;
    let startX = 0, startY = 0, startLeft = 0, startTop = 0;

    const onDown = (e) => {
      if (e.button !== 0) return;

      const rect = win.getBoundingClientRect();
      startX = e.clientX;
      startY = e.clientY;
      startLeft = rect.left;
      startTop = rect.top;

      dragging = true;

      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);

      win.style.left = startLeft + 'px';
      win.style.top = startTop + 'px';
    };

    const onMove = (e) => {
      if (!dragging) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      win.style.left = startLeft + dx + 'px';
      win.style.top = startTop + dy + 'px';
    };

    const onUp = () => {
      dragging = false;
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };

    title.addEventListener('mousedown', onDown);
  });
});
          window.initRoomMenu({ mapImageSrc: '/assets/map/hallway-map.svg', mapLabel: 'Hallway' });
</script>
