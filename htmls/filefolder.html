<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Entry 1</title>
    <link rel="stylesheet" href="../main.css">
  </head>
  <style>

    div{
      cursor: pointer;
      width:300px
    }

  </style>
  <body class="filefolder">
    <!-- <h4 style="font-weight: 200;">project_folder</h4> -->
    <ul class="list">
      <li id="open-iframe-item" data-src="htmls/fullscreen-frame.html">
        <div class="thumb"><img src="../assets/app icon.svg" alt="thumb" style="width:28px;height:28px"></div>
        <div>Homebase Archive</div>
      </li>
        <li>
            <div class="thumb"><img src="../assets/file.svg" alt="thumb" style="width:28px;height:28px"></div>
            <div id="password-item">Password</div>
        </li>
        <li id="readme-item">
            <div class="thumb"><img src="../assets/file.svg" alt="thumb" style="width:28px;height:28px"></div>
            <div>READ ME</div>
        </li>
    </ul>
    <script>
      // Send messages to parent to open windows / fullscreen iframe.
      const post = (msg) => parent.postMessage(msg, '*');
      document.getElementById('password-item').addEventListener('click', () => post('open-password'));
      document.getElementById('readme-item').addEventListener('click', () => post('open-readme'));
      const openItem = document.getElementById('open-iframe-item');
      if (openItem) openItem.addEventListener('click', () => post('open-iframe:' + openItem.dataset.src));
    </script>
    <script src="../main.js"></script>
  </body>

  
</html>
