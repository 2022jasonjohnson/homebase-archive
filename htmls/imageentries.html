<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Image Entries</title>
    <link rel="stylesheet" href="../main.css">
  </head>
  <body class="filefolder" style="margin:0; height:100vh; display:flex; align-items:center; justify-content:center;">
    <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:12px; box-sizing:border-box;">
      <img id="entry-image" src="../assets/items/bin.png" alt="entry image" style="max-width:100%; max-height:100%; object-fit:contain;">
    </div>
    <script>
      // Get the item from URL query parameter
      const urlParams = new URLSearchParams(window.location.search);
      const item = urlParams.get('item');
      
      const imageElement = document.getElementById('entry-image');
      
      // Map items to their image paths
      const imageMap = {
        'bin': '../assets/image entries/bin image.jpg',
        'shirt': '../assets/image entries/shirt image.jpg',
        'swing': '../assets/image entries/swing image.jpg',
        'bottom-magnet': '../assets/image entries/bottom-magnet image.jpg',
        'fridge-magnet': '../assets/image entries/fridge-magnet image.jpg',
        'wall-photo': '../assets/image entries/wall-photo image.jpg',
        'bedroom-photo': '../assets/image entries/bedroom-photo image.jpg',
        'family-photo': '../assets/image entries/family-photo image.jpg',
        'early-porch': '../assets/image entries/early-porch image.jpg',
        'living-room-table': '../assets/image entries/living-room-table image.jpg',
        'marriage-wall-frame': '../assets/image entries/marriage-wall frame image.jpg',
        'goggles': '../assets/image entries/goggles image.jpg',
        'clown': '../assets/image entries/clown image.jpg',
        'bank-statement': '../assets/image entries/bank-statement image.jpg',
        
      };
      
      if (imageMap[item]) {
        imageElement.src = imageMap[item];
      } else {
        imageElement.alt = 'Image not found';
      }
    </script>
  </body>
</html>
