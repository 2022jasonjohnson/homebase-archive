<!DOCTYPE html>
<html>
<head>
  <title>XP Text Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="main.css">

  <style>
    body {
      margin: 0;
      font-family: "TahomaBit", Tahoma, "MS Sans Serif", "Segoe UI", sans-serif;
      background: #60adb1;
    }

    #computer-screen {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .window {
      position: absolute;
      top: 100px;
      left: 100px;
      width: 400px;
      background: #FFF1D4;
      border: 4px solid #1dc48f;
    }

    .title-bar {
      height: 40px;
      background: #1dc48f;
      display: flex;
      align-items: center;
      padding: 0 10px;
      cursor: grab;
    }

    .content {
      padding: 12px;
    }

    #clock {
      position: absolute;
      bottom: 10px;
      right: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div id="computer-screen">

  <div class="window">
    <div class="title-bar"><div class="title">READ ME</div></div>
    <div class="content">
      <h2 class="xpify">Welcome to my project</h2>
      <p class="xpify">
        This is a test of pixelated text rendering using canvas. It should look blocky and retro.
      </p>
    </div>
  </div>

  <div id="clock"></div>

</div>

<script>
/* =========================
   CLOCK
========================= */
function updateClock() {
  const now = new Date();
  let h = now.getHours();
  let m = now.getMinutes();
  const ampm = h >= 12 ? "PM" : "AM";

  h = h % 12 || 12;
  h = h < 10 ? "0" + h : h;
  m = m < 10 ? "0" + m : m;

  document.getElementById("clock").textContent = h + ":" + m + " " + ampm;
}

setInterval(updateClock, 1000);
updateClock();
</script>
<script src="main.js"></script>

</body>
</html>
